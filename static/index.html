<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Snake Training Room</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <main class="workspace">
        <header class="page-head">
            <div class="title-row">
                <h1>Training Room</h1>
                <p class="eyebrow">Reinforcement Snake</p>
            </div>
            <div class="action-row">
                <button id="saveWeightsBtn" class="btn btn-secondary">Save Weights</button>
                <button id="loadWeightsBtn" class="btn btn-secondary">Load Saved / Best</button>
                <button id="resetBtn" class="btn reset-floating">Reset Weights &amp; Start Over</button>
            </div>
        </header>

        <section class="top-grid">
            <section id="gamePanel" class="panel game-panel">
                <div class="panel-body game-body">
                    <canvas id="gameCanvas" width="400" height="400"></canvas>
                </div>
            </section>

            <section class="panel ann-panel">
                <div class="panel-body ann-body">
                    <div class="network-stage">
                        <canvas id="networkCanvas"></canvas>
                    </div>
                    <div class="network-legend">
                        <span><i class="legend-dot positive"></i>Positive weight</span>
                        <span><i class="legend-dot negative"></i>Negative weight</span>
                        <span><i class="legend-dot active"></i>Active neuron</span>
                    </div>
                </div>
            </section>
        </section>

        <section class="panel dashboard-panel">
            <div class="panel-body dashboard-body">
                <div class="stats-grid">
                    <div class="stat-card">
                        <span class="stat-label">Episode</span>
                        <span id="episodes" class="stat-val">0</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">High Score</span>
                        <span id="highScore" class="stat-val">0</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Epsilon</span>
                        <span id="epsilon" class="stat-val">1.00</span>
                    </div>
                    <div id="currentScoreCard" class="stat-card">
                        <span class="stat-label">Current Score</span>
                        <span id="currentScore" class="stat-val">0</span>
                    </div>
                    <div id="avgScoreCard" class="stat-card">
                        <span class="stat-label">Avg Score</span>
                        <span id="avgScore" class="stat-val">0</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Replay Buffer</span>
                        <span id="bufferSize" class="stat-val">0</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
